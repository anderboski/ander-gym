name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-wide default is read-only. Only the deploy job gets the Pages
# write + OIDC scopes: the build job runs `npm ci`, which executes third-party
# install scripts, and those must never run where a deploy token can be minted.
permissions:
  contents: read

# Never run two deploys at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to new
# code, and this workflow holds `pages: write` + `id-token: write`, so a
# swapped action could ship JS that reads every user's IndexedDB. Bump by
# replacing the SHA and the version comment together.
jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the site's Pages config through the API.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing here pushes: keep the token out of .git/config, away from npm scripts.
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Same gate as ci.yml: a workflow_dispatch or a direct push to main
      # skips the PR check, so the deploy must not trust that it ran.
      - run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
