name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-wide default is read-only. Only the deploy job gets the Pages
# write + OIDC scopes: the build job runs `npm ci`, which executes third-party
# install scripts, and those must never run where a deploy token can be minted.
permissions:
  contents: read

# Never run two deploys at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to new
# code, and this workflow holds `pages: write` + `id-token: write`, so a
# swapped action could ship JS that reads every user's IndexedDB. Bump by
# replacing the SHA and the version comment together.
jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the site's Pages config through the API.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing here pushes: keep the token out of .git/config, away from npm scripts.
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Same gate as ci.yml: a workflow_dispatch or a direct push to main
      # skips the PR check, so the deploy must not trust that it ran.
      - run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
