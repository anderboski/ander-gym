# Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
# understands `@<sha> # vX.Y.Z` pins and rewrites both the SHA and the comment.
# Only Actions for now: npm deps are few, and bumping them is a reviewed
# change (see `npm audit` in CLAUDE.md), not a background chore.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all action bumps rather than one per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
