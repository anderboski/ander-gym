# Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
# understands `@<sha> # vX.Y.Z` pins and rewrites both the SHA and the comment.
# Actions get routine weekly bumps; npm gets security updates only (see the
# npm entry below) — routine npm bumps stay a reviewed change, not a chore.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all action bumps rather than one per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore

  # npm: security updates only. `open-pull-requests-limit: 0` suppresses
  # routine version bumps (those stay a reviewed change), but Dependabot
  # security updates ignore the limit and still open a PR when an advisory
  # lands — so a high-severity fix no longer waits for CI to trip over it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
