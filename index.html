<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1216" />

    <!--
      Applies the user's light/dark override (src/data/theme.ts) before first
      paint, so toggling in-app never causes a flash on the next load. Falls
      back to the OS preference when nothing has been chosen yet.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ander-gym-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute(
            'content',
            theme === 'light' ? '#f7f8fa' : '#0f1216',
          );
        } catch (e) {}
      })();
    </script>

    <!--
      Applies the user's language choice (src/data/i18n.tsx) before first
      paint, so the app never flashes English text before switching to
      Spanish. Falls back to the browser language, then English.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ander-gym-language');
          var lang =
            stored === 'en' || stored === 'es'
              ? stored
              : navigator.language.toLowerCase().indexOf('es') === 0
                ? 'es'
                : 'en';
          document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <link rel="apple-touch-icon" href="/ander-gym/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/ander-gym/icons/favicon.svg" />

    <title>Ander Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
